<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - MDAS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container" style="text-align:center; padding-top:80px">
    <div class="card" style="max-width:520px; margin:0 auto;">
      <h2>You are offline</h2>
      <p class="muted mt">Some features need an Internet connection, but emergency information is still available.</p>
      <div class="section-actions mt" style="justify-content:center">
        <a class="btn" href="/">Emergency Info Home</a>
        <button class="btn secondary" onclick="location.reload()">Retry Connection</button>
      </div>
      <p class="muted mt" style="font-size:.8rem">
        Tip: emergency contacts, alerts, weather and evacuation data loaded while you were online
        remain accessible from the home page.
      </p>
    </div>
  </main>
</body>
</html>
